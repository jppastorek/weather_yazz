<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Yazz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="broadcast-shell">
      <div class="weather-screen">
        <header class="top-bar">
          <div class="brand-box" aria-label="Weather Yazz">
            <span class="brand-the">THE</span>
            <span class="brand-weather">WEATHER</span>
            <span class="brand-yazz">YAZZ</span>
          </div>

          <div class="title-block">
            <div class="title-kicker">LOCAL WEATHER</div>
            <div class="panel-title">Current<br />Conditions</div>
          </div>

          <div class="clock-block">
            <div id="current-time">--:-- --</div>
            <div id="current-date">---</div>
          </div>
        </header>

        <main class="current-panel">
          <section class="left-weather">
            <div class="temperature" id="temperature">82°</div>
            <div class="condition" id="condition">Partly Smooth</div>

            <div class="weather-art" aria-hidden="true">
              <div class="sun"></div>
              <div class="cloud cloud-back"></div>
              <div class="cloud cloud-front"></div>
            </div>
          </section>

          <section class="conditions-table" aria-label="Current conditions">
            <div class="data-label">AT:</div>
            <div class="data-value location" id="location">New Orleans</div>

            <div class="data-label">Feels Like:</div>
            <div class="data-value" id="feels-like">86°</div>

            <div class="data-label">Humidity:</div>
            <div class="data-value" id="humidity">72%</div>

            <div class="data-label">Pressure:</div>
            <div class="data-value" id="pressure">30.02</div>

            <div class="data-label">Wind:</div>
            <div class="data-value" id="wind">SE 8 mph</div>
          </section>
        </main>

        <section class="status-strip">
          <div class="status-label">YAZZCAST</div>
          <div class="status-message" id="status-message">
            SMOOTH CONDITIONS CONTINUE ACROSS THE AREA
          </div>
        </section>

        <section class="yazz-strip">
          <div class="now-playing">
            <span class="now-playing-label">NOW PLAYING:</span>
            <span class="track-name">WEATHER YAZZ</span>
          </div>

          <button id="yazz-button" type="button">ENTER THE YAZZ</button>
        </section>

        <footer>
          <span>© 2026 WEATHER YAZZ</span>
          <span>BY JPP</span>
        </footer>

        <div class="crt-overlay" aria-hidden="true"></div>
      </div>
    </div>

    <script src="app.js" defer></script>
  </body>
</html>
